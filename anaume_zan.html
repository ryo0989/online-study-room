<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>穴埋め算</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Yu Gothic UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
    }
    h1 {
      color: #fff;
      font-size: 2em;
      margin-bottom: 24px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.25);
      letter-spacing: 0.05em;
    }
    .stats-bar {
      display: flex;
      gap: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .stat {
      text-align: center;
      padding: 16px 28px;
      border-right: 1px solid #e2e8f0;
    }
    .stat:last-child { border-right: none; }
    .stat-value {
      font-size: 1.9em;
      font-weight: 700;
      color: #553c9a;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 0.68em;
      color: #718096;
      margin-top: 3px;
      white-space: nowrap;
    }
    .problem-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 48px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }
    .timer {
      font-size: 0.9em;
      color: #a0aec0;
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }
    .equation {
      font-size: 2.8em;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      line-height: 1.3;
    }
    .eq-op  { color: #553c9a; }
    .eq-sign { color: #a0aec0; font-weight: 400; }
    .blank-box {
      display: inline-block;
      width: 76px;
      height: 62px;
      border: 3px solid #667eea;
      border-radius: 10px;
      background: #f0f4ff;
    }
    .answer-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }
    input#ans {
      font-size: 1.5em;
      width: 140px;
      text-align: center;
      border: 2px solid #cbd5e0;
      border-radius: 10px;
      padding: 10px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input#ans:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.22); }
    input#ans:disabled { background: #f7fafc; color: #a0aec0; }
    button {
      font-size: 1em;
      font-family: inherit;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { filter: opacity(0.45); cursor: default; }
    .btn-check { background: #667eea; color: #fff; padding: 11px 26px; box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
    .btn-check:hover:not(:disabled) { filter: brightness(1.1); }
    .feedback {
      min-height: 1.8em;
      font-size: 1.15em;
      font-weight: 600;
    }
    .ok  { color: #38a169; }
    .ng  { color: #e53e3e; }
    .action-row {
      display: flex;
      gap: 16px;
    }
    .btn-next   { background: #48bb78; color: #fff; padding: 14px 38px; font-size: 1.05em; box-shadow: 0 4px 12px rgba(72,187,120,0.4); }
    .btn-next:hover { filter: brightness(1.08); }
    .btn-export { background: #ed8936; color: #fff; padding: 14px 30px; font-size: 1.05em; box-shadow: 0 4px 12px rgba(237,137,54,0.4); }
    .btn-export:hover { filter: brightness(1.08); }
    @media (max-width: 480px) {
      .problem-card { padding: 24px 20px; }
      .equation { font-size: 2em; gap: 8px; }
      .blank-box { width: 58px; height: 48px; }
      .stat { padding: 12px 16px; }
      .stat-value { font-size: 1.4em; }
    }
    .settings-wrapper {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
    }
    .btn-settings {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 1em;
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .btn-settings:hover { background: rgba(255,255,255,0.34); }
    .settings-panel {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      padding: 12px;
      min-width: 160px;
    }
    .settings-panel.open { display: block; }
    .settings-panel .btn-export {
      width: 100%;
      background: #ed8936;
      color: #fff;
      padding: 11px 18px;
      font-size: 0.95em;
      box-shadow: 0 3px 8px rgba(237,137,54,0.35);
    }
    .settings-panel .btn-export:hover { filter: brightness(1.08); }
  </style>
</head>
<body>

<div class="settings-wrapper">
  <button class="btn-settings" id="btn-settings" onclick="toggleSettings()">⚙ 設定</button>
  <div class="settings-panel" id="settings-panel">
    <button class="btn-export" onclick="exportXlsx()">📊 Excel出力</button>
  </div>
</div>

<h1>穴埋め算</h1>

<div class="stats-bar">
  <div class="stat"><div class="stat-value" id="s-total">0</div><div class="stat-label">問題数</div></div>
  <div class="stat"><div class="stat-value" id="s-correct">0</div><div class="stat-label">正答数</div></div>
  <div class="stat"><div class="stat-value" id="s-rate">—</div><div class="stat-label">正答率</div></div>
  <div class="stat"><div class="stat-value" id="s-avg">—</div><div class="stat-label">平均解答時間</div></div>
</div>

<div class="problem-card">
  <div class="timer" id="timer">0.0 秒</div>
  <div class="equation" id="eq"></div>
  <div class="answer-row">
    <input type="number" id="ans" placeholder="？" autocomplete="off">
    <button class="btn-check" id="btn-check" onclick="submit()">答え合わせ</button>
  </div>
  <div class="feedback" id="fb"></div>
</div>

<div class="action-row">
  <button class="btn-next" onclick="next()">次の問題 →</button>
</div>

<script>
/* ── helpers ── */
const rand = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function applyOp(x, op, y) {
  if (op === '+') return x + y;
  if (op === '-') return x - y;
  return x * y; // ×
}

/* evaluate a op1 b op2 c with standard precedence (× before +/-) */
function evaluate(a, op1, b, op2, c) {
  if (op1 === '×' && op2 !== '×') return applyOp(a * b, op2, c);
  if (op2 === '×' && op1 !== '×') return applyOp(a, op1, b * c);
  return applyOp(applyOp(a, op1, b), op2, c); // both +/-
}

/* solve for blank at pos; returns {val, ok} where ok = val is integer in range */
function solve(pos, a, op1, b, op2, c, res) {
  if (pos === 3) {
    const v = evaluate(a, op1, b, op2, c);
    return { val: v, ok: Number.isInteger(v) && v > 0 };
  }

  const mulFirst  = op1 === '×' && op2 !== '×'; // (a×b) op2 c = res
  const mulSecond = op2 === '×' && op1 !== '×'; // a op1 (b×c) = res

  let val;

  if (mulFirst) {
    // a×b op2 c = res  →  a×b = S
    const S = op2 === '+' ? res - c : res + c;
    if (pos === 0) val = S / b;
    else if (pos === 1) val = S / a;
    else /* pos=2 */ val = op2 === '+' ? res - a * b : a * b - res;
  } else if (mulSecond) {
    // a op1 b×c = res  →  b×c = P
    const P = op1 === '+' ? res - a : a - res;
    if (pos === 0) val = op1 === '+' ? res - b * c : res + b * c;
    else if (pos === 1) val = P / c;
    else /* pos=2 */ val = P / b;
  } else {
    // (a op1 b) op2 c = res
    const AB = op2 === '+' ? res - c : res + c; // a op1 b = AB
    if (pos === 0) val = op1 === '+' ? AB - b : AB + b;
    else if (pos === 1) val = op1 === '+' ? AB - a : a - AB;
    else /* pos=2 */ val = op2 === '+' ? res - applyOp(a, op1, b) : applyOp(a, op1, b) - res;
  }

  const isInt = Number.isFinite(val) && Math.abs(val - Math.round(val)) < 1e-9;
  const v = Math.round(val);
  const inRange = v >= 10 && v <= 99;
  return { val: v, ok: isInt && inRange };
}

/* ── problem generation ── */
// Exclude ['-','×'] because for 2-digit numbers a-b×c is always negative
const COMBOS = [['+','-'],['-','+'],['+','×'],['×','+'],['-','×'],['×','-']].filter(
  ([o1,o2]) => !(o1 === '-' && o2 === '×')
);

function genProblem() {
  for (let i = 0; i < 3000; i++) {
    const [op1, op2] = pick(COMBOS);
    const a = rand(10, 99), b = rand(10, 99), c = rand(10, 99);
    const res = evaluate(a, op1, b, op2, c);
    if (!Number.isInteger(res) || res <= 0 || res > 99999) continue;

    const valid = [];
    for (let pos = 0; pos <= 3; pos++) {
      const s = solve(pos, a, op1, b, op2, c, res);
      if (s.ok) valid.push({ pos, answer: s.val });
    }
    if (!valid.length) continue;

    const chosen = pick(valid);
    return { a, op1, b, op2, c, res, blankPos: chosen.pos, answer: chosen.answer };
  }
  return null; // shouldn't happen
}

/* ── render ── */
function renderEq(p) {
  const nums = [p.a, p.b, p.c, p.res];
  const cell = (i) => i === p.blankPos
    ? `<span class="blank-box"></span>`
    : `<span>${nums[i]}</span>`;
  return `${cell(0)}<span class="eq-op">${p.op1}</span>${cell(1)}<span class="eq-op">${p.op2}</span>${cell(2)}<span class="eq-sign">＝</span>${cell(3)}`;
}

function eqText(p) {
  const nums = [p.a, p.b, p.c, p.res];
  const d = nums.map((v,i) => i === p.blankPos ? '□' : v);
  return `${d[0]} ${p.op1} ${d[1]} ${p.op2} ${d[2]} = ${d[3]}`;
}

/* ── state ── */
let cur = null, t0 = 0, tid = 0, done = false, log = [], lastExportIdx = 0;

function startTimer() {
  t0 = Date.now();
  clearInterval(tid);
  tid = setInterval(() => {
    document.getElementById('timer').textContent = ((Date.now()-t0)/1000).toFixed(1) + ' 秒';
  }, 100);
}
function stopTimer() { clearInterval(tid); return (Date.now()-t0)/1000; }

function updateStats() {
  const n = log.length, ok = log.filter(r=>r.isCorrect).length;
  document.getElementById('s-total').textContent   = n;
  document.getElementById('s-correct').textContent = ok;
  document.getElementById('s-rate').textContent    = n ? Math.round(ok/n*100)+'%' : '—';
  document.getElementById('s-avg').textContent     = n
    ? (log.reduce((s,r)=>s+r.time,0)/n).toFixed(1)+'s' : '—';
}

function next() {
  done = false;
  document.getElementById('fb').textContent = '';
  document.getElementById('fb').className = 'feedback';
  const inp = document.getElementById('ans');
  inp.value = ''; inp.disabled = false;
  document.getElementById('btn-check').disabled = false;

  cur = genProblem();
  document.getElementById('eq').innerHTML = renderEq(cur);
  startTimer();
  inp.focus();
}

function submit() {
  if (done || !cur) return;
  const raw = document.getElementById('ans').value.trim();
  if (raw === '') return;
  const elapsed = stopTimer();
  done = true;

  const user = parseInt(raw, 10);
  const correct = user === cur.answer;
  const fb = document.getElementById('fb');
  fb.textContent = correct ? '✓ 正解！' : `✗ 不正解。正解は ${cur.answer} です。`;
  fb.className = 'feedback ' + (correct ? 'ok' : 'ng');

  log.push({ no: log.length+1, eq: eqText(cur), user, answer: cur.answer, isCorrect: correct, time: elapsed });
  updateStats();

  document.getElementById('ans').disabled = true;
  document.getElementById('btn-check').disabled = true;
}

/* ── Excel export ── */
const STORAGE_KEY = 'anaume_export_history';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveHistory(rows) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
}

function exportXlsx() {
  const slice = log.slice(lastExportIdx);
  if (!slice.length) { alert('前回の出力以降に解かれた問題がありません。'); return; }

  const n = slice.length;
  const ok = slice.filter(r => r.isCorrect).length;
  const avgTime = slice.reduce((s, r) => s + r.time, 0) / n;
  const newRow = [
    new Date().toLocaleString('ja-JP'),
    n,
    +(ok / n * 100).toFixed(1),
    +avgTime.toFixed(2)
  ];

  const history = loadHistory();
  history.push(newRow);
  saveHistory(history);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['日時', '回答数', '正答率(%)', '平均解答時間(秒)'],
    ...history
  ]);
  ws['!cols'] = [{wch:20}, {wch:10}, {wch:12}, {wch:18}];
  XLSX.utils.book_append_sheet(wb, ws, '結果');

  XLSX.writeFile(wb, '穴埋め算_記録.xlsx');

  lastExportIdx = log.length;
}

/* ── settings panel ── */
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}
document.addEventListener('click', e => {
  const wrapper = document.getElementById('settings-wrapper') || e.target.closest('.settings-wrapper');
  if (!e.target.closest('.settings-wrapper')) {
    document.getElementById('settings-panel').classList.remove('open');
  }
});

/* ── keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') { done ? next() : submit(); }
});

next();
</script>
</body>
</html>
